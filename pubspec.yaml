name: tk_safa_app
description: Sistem Informasi Penilaian dan Administrasi Siswa TK Islam Safa
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^13.0.0
  flutter_riverpod: ^2.4.9
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.2.1
  pdf: ^3.10.7
  path_provider: ^2.1.1
  supabase_flutter: ^2.3.0
  image_picker: ^1.0.7
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_safa.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo_safa.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
